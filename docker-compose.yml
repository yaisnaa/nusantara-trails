# Docker Compose — Nusantara Trails
# Terdiri dari 3 container: db (MariaDB), app (Next.js), nginx (reverse proxy)
# Jalankan: docker compose up -d --build

services:

  # ──────────────────────────────────────────────
  # Container 1: Database — MariaDB 11
  # ──────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: nusantara_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume persisten: data database tidak hilang saat container di-restart
      - db_data:/var/lib/mysql
      # SQL init: buat database jika belum ada saat pertama kali
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nusantara_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Container 2: Aplikasi — Next.js 16
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusantara_app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      UPLOAD_DIR: /www/uploads
    volumes:
      # Volume uploads: berbagi folder foto dengan container nginx
      - uploads_data:/www/uploads
    networks:
      - nusantara_net
    depends_on:
      db:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Container 3: Web Server — Nginx
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nusantara_nginx
    restart: unless-stopped
    ports:
      # Bind ke localhost:8080 saja — aaPanel Nginx yang akan proxy ke sini
      # Tidak langsung terekspos ke internet, menghindari konflik dengan aaPanel port 80
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Volume uploads: Nginx serve file foto langsung (bypass Next.js)
      - uploads_data:/www/uploads:ro
    networks:
      - nusantara_net
    depends_on:
      - app

# ──────────────────────────────────────────────
# Volumes persisten
# ──────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

# ──────────────────────────────────────────────
# Internal network (container tidak terekspos langsung ke host)
# ──────────────────────────────────────────────
networks:
  nusantara_net:
    driver: bridge
