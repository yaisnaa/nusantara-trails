# Konfigurasi Nginx sebagai reverse proxy untuk Nusantara Trails
# Tugas utama:
#   1. Forward semua request ke container Next.js (port 3000)
#   2. Serve file upload langsung dari volume (bypass Next.js)

server {
    listen 80;
    server_name _;

    # Batas ukuran upload sesuai dengan validasi app (5MB)
    client_max_body_size 6M;

    # Gzip compression untuk performa lebih baik
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ─── Static files: gambar yang diupload penyedia ───────────────────────
    # Nginx melayani langsung dari shared volume tanpa melalui Next.js
    # Ini jauh lebih efisien untuk file statis berukuran besar
    location /uploads/ {
        alias /www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Hanya izinkan file gambar
        location ~* \.(jpg|jpeg|png|webp)$ {
            try_files $uri =404;
        }
    }

    # ─── Semua request lain: forward ke Next.js ────────────────────────────
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Header untuk WebSocket (Next.js HMR) dan proxy yang benar
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
